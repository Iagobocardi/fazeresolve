services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok", "localhost:27017/test"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build: ./fazeresolve-fix-api-errors-and-update-landing-page
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/fazeresolve
      JWT_SECRET: fazeresolve-demo-secret-change-in-production
      SESSION_SECRET: fazeresolve-demo-session-secret-change-in-production
      CRYPTO_SECRET_KEY: 12345678901234567890123456789012
      CRYPTO_IV: 1234567890123456
      FRONTEND_URL: http://localhost:3001
      ENABLE_JOBS: "false"
      SEED_DEMO_DATA: "true"
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  frontend:
    build:
      context: ./az-e-resolve-frontend-bug-saldo-devedor-investigation
      args:
        REACT_APP_API_URL: http://localhost:3000/api
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  mongo_data:
